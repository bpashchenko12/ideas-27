<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Password gate: keep this line first. -->
<script src="../../assets/js/gate.js?v=fe2ac3c6"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team contests · XMTrading</title>
<link rel="stylesheet" href="../../assets/css/xm.css">
<style>
/* =====================================================================
   IDEA 01 · Team contests
   PWA Competitions page with a "Register as a team" flow.
   ===================================================================== */
body { background: #f5f5f5; }
[hidden] { display: none !important; }
main button { border: 0; background: none; font: inherit; color: inherit; cursor: pointer; padding: 0; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px 96px; }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding: 22px 0 14px; }
.head h1 { font-size: clamp(26px, 3vw, 36px); line-height: 1.1; letter-spacing: -.025em; margin-top: 4px; }
.head p { color: var(--ink-2); max-width: 660px; font-size: 14.5px; margin-top: 6px; }
.head .pill-tabs { box-shadow: var(--sh-s); }
.head .pill-tabs button { padding: 10px 20px; transition: background .15s, color .15s; }

.cap { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; padding: 11px 16px; border-radius: 14px; background: #fff; border: 1px solid var(--line); font-size: 13.5px; color: var(--ink-2); }
.cap .n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--g); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.cap b { color: var(--ink); }

/* ---------- PWA frame ---------- */
.pwa { display: flex; background: #fff; border: 1px solid var(--line-2); border-radius: 18px; box-shadow: var(--sh-l); overflow: hidden; min-height: 720px; }
.nav { flex: none; width: 74px; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; }
.nav .lg { margin-bottom: 14px; }
.nav .lg svg { height: 20px; width: auto; }
.nav button { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--ink-2); }
.nav button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav button.on { color: var(--g); background: var(--g-l); }
.nav .sp { flex: 1; }
.pmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; justify-content: flex-end; align-items: center; gap: 18px; padding: 12px 24px; border-bottom: 1px solid var(--line); height: 54px; }
.top svg { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.top .bellw { position: relative; }
.top .bellw::after { content: ''; position: absolute; top: -1px; right: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
.content { flex: 1; padding: 22px 28px 40px; max-width: 1040px; width: 100%; margin: 0 auto; }
.content h2.t { font-size: 24px; letter-spacing: -.02em; }
.ptabs { display: flex; gap: 20px; margin: 12px 0 16px; border-bottom: 1px solid var(--line); }
.ptabs button { padding: 6px 2px 10px; font-size: 13px; color: var(--mut); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.ptabs button.on { color: var(--ink); font-weight: 600; border-color: #2f62f0; }

/* hero */
.hero { position: relative; border-radius: 22px; overflow: hidden; background: linear-gradient(100deg, #000 0%, #030a1a 45%, #0b2a63 100%); color: #fff; padding: 40px 36px; min-height: 190px; margin-bottom: 16px; }
.hero small { display: block; color: #f5b82e; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; margin-bottom: 10px; }
.hero h3 { font-size: 34px; letter-spacing: -.02em; line-height: 1.1; }
.hero p { color: #9aa3b5; font-size: 13.5px; margin-top: 10px; max-width: 420px; }
.pod { position: absolute; right: 56px; bottom: 0; display: flex; align-items: flex-end; gap: 4px; }
.pod i { display: block; width: 64px; border-radius: 12px 12px 0 0; background: linear-gradient(180deg, #7d5bd8, #e08cc0); }
.pod i:nth-child(1) { height: 58px; } .pod i:nth-child(2) { height: 92px; } .pod i:nth-child(3) { height: 126px; background: linear-gradient(180deg, #ee9c84, #f2c7bd); }
.pod b { position: absolute; width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c4, #e6a915 70%); left: 135px; bottom: 150px; box-shadow: 0 0 24px rgba(240,180,30,.6); }
.pills { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.pills button { padding: 6px 14px; border-radius: 999px; background: var(--soft); font-size: 12px; font-weight: 600; color: var(--ink-2); }
.pills button.on { background: #1d2430; color: #fff; }

/* contest cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.cc { border-radius: 20px; overflow: hidden; background: #fff; border: 1px solid var(--line); box-shadow: var(--sh-s); display: flex; flex-direction: column; }
.cc-img { position: relative; height: 210px; padding: 14px; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; background: radial-gradient(120% 90% at 70% 15%, #6fd3ff 0%, #2a6b8f 38%, #0b2233 100%); }
.cc-img.b { background: radial-gradient(120% 90% at 30% 15%, #e2b6ff 0%, #6a3fb0 40%, #1b0f33 100%); }
.cc-img.c { background: radial-gradient(120% 90% at 50% 15%, #cfd5dd 0%, #6b7480 45%, #1d2127 100%); }
.cc-img .ring { position: absolute; top: 26px; left: 50%; transform: translateX(-50%); width: 96px; height: 96px; border-radius: 50%; border: 10px solid rgba(255,255,255,.35); box-shadow: 0 0 40px rgba(255,120,220,.55), inset 0 0 22px rgba(255,255,255,.4); }
.cc-img .ring::after { content: ''; position: absolute; inset: 20px; border-radius: 50%; border: 8px solid rgba(255,90,200,.75); }
.chp { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.chp span { padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.2); backdrop-filter: blur(4px); font-size: 10px; font-weight: 700; letter-spacing: .04em; }
.cc-img h4 { font-size: 19px; letter-spacing: -.01em; }
.cc-b { padding: 14px; display: grid; gap: 8px; }
.cc-b .row2 { display: flex; gap: 8px; }
.cc-b .row2 .btn { flex: 1; }
.cc-b .note { font-size: 12px; color: var(--mut); }
.cc-b .joined { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; color: var(--g-d); }
.mini { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line-2); }
.dots i.f { background: var(--g); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* team lobby */
.crumb { font-size: 13px; color: var(--mut); margin-bottom: 6px; }
.crumb button { color: var(--g); font-weight: 600; }
.tl { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; margin-top: 14px; }
.box { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--sh-s); }
.box h3 { font-size: 16px; }
.box .sub { font-size: 12.5px; color: var(--mut); margin: 2px 0 14px; }
.tname { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.tname .lg { width: 52px; height: 52px; border-radius: 14px; background: #1d2430; color: #f5b82e; display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; }
.tname h2 { font-size: 22px; letter-spacing: -.02em; line-height: 1.1; }
.tname small { color: var(--mut); font-size: 12.5px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.stats div { padding: 12px 14px; border-radius: 12px; background: var(--soft); }
.stats small { display: block; font-size: 11.5px; color: var(--mut); }
.stats b { font-size: 22px; letter-spacing: -.02em; }
.stats b span { font-size: 13px; color: var(--mut); font-weight: 500; }
.slots { display: flex; gap: 8px; margin-bottom: 8px; }
.slots i { flex: 1; height: 8px; border-radius: 6px; background: var(--line-2); transition: background .3s; }
.slots i.f { background: var(--g); }
.cnt { font-size: 13px; color: var(--ink-2); margin-bottom: 16px; }
.cnt b { color: var(--ink); }
.mem { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); animation: pop .3s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } }
.av { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: #cfe0ff; color: #274a9a; }
.av.c1 { background: #ffd9d9; color: #9a2a2a; } .av.c2 { background: #d6f0e3; color: #0b6b44; } .av.c3 { background: #ffe2c7; color: #8a4a00; } .av.c4 { background: #e6dcf7; color: #5a3a96; } .av.c5 { background: #f3d98b; color: #7a5a00; }
.mem .nm { flex: 1; min-width: 0; }
.mem .nm b { display: block; font-size: 14px; }
.mem .nm small { color: var(--mut); font-size: 12px; }
.mem .rm { font-size: 12px; color: var(--mut); text-decoration: underline; }
.mem .rm:hover { color: var(--dn); }
.mem.empty { color: var(--mut); }
.mem.empty .av { background: transparent; border: 1.5px dashed var(--line-2); color: var(--mut); font-size: 18px; font-weight: 400; }
.mem.empty button { text-decoration: underline; color: var(--g); font-size: 12.5px; font-weight: 600; }
.link { display: flex; gap: 8px; margin-bottom: 10px; }
.link input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 11px 12px; border: 1.5px solid var(--line-2); border-radius: 10px; background: var(--soft); color: var(--ink); }
.link.off input { color: var(--mut); text-decoration: line-through; }
.share { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.share button { padding: 9px 4px; border-radius: 10px; border: 1.5px solid var(--line-2); font-size: 12.5px; font-weight: 600; }
.share button:hover:not([disabled]) { border-color: var(--g); background: var(--g-l); }
.share button[disabled] { opacity: .45; cursor: not-allowed; }
.msg { padding: 11px 13px; border-radius: 12px; background: var(--soft); font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
.full { padding: 12px 14px; border-radius: 12px; background: var(--g-l); color: var(--g-d); font-size: 13px; font-weight: 600; margin-bottom: 12px; }
.demo { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.demo small { color: var(--mut); font-size: 11.5px; flex-basis: 100%; }
.lnk { font-size: 12.5px; color: var(--mut); text-decoration: underline; }
.empty { text-align: center; padding: 50px 20px; }
.empty .ic { width: 64px; height: 64px; border-radius: 50%; background: var(--g-l); color: var(--g); display: grid; place-items: center; margin: 0 auto 14px; }
.empty .ic svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.empty h3 { font-size: 18px; }
.empty p { color: var(--ink-2); font-size: 13.5px; max-width: 380px; margin: 6px auto 16px; }

/* leaderboards */
.pools { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
.pool { padding: 16px 18px; border-radius: 16px; background: #1d2430; color: #fff; }
.pool.t { background: linear-gradient(120deg, #0f4b37, #008454); }
.pool small { font-size: 11.5px; color: #c4cad6; display: block; }
.pool b { font-size: 26px; letter-spacing: -.02em; }
.lb { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.lb th { text-align: left; font-size: 11.5px; color: var(--mut); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.lb td { padding: 11px 10px; border-bottom: 1px solid var(--line); }
.lb td:first-child { width: 44px; font-weight: 700; }
.lb td.r, .lb th.r { text-align: right; }
.lb tr.me td { background: var(--g-l); font-weight: 600; }
.lb .sm { display: block; font-size: 11.5px; color: var(--mut); font-weight: 400; }

/* modal */
.ovl { position: fixed; inset: 0; z-index: 100; background: rgba(9,10,12,.55); display: grid; place-items: center; padding: 16px; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.dlg { width: 100%; max-width: 440px; background: #fff; border-radius: 20px; padding: 24px; box-shadow: var(--sh-l); }
.dlg h3 { font-size: 19px; letter-spacing: -.01em; }
.dlg p { font-size: 13px; color: var(--ink-2); margin: 6px 0 16px; line-height: 1.5; }
.dlg label { font-size: 12.5px; color: var(--ink-2); display: block; margin-bottom: 6px; }
.dlg input { width: 100%; font: inherit; font-size: 14px; padding: 12px 14px; border: 1.5px solid var(--line-2); border-radius: 10px; outline: none; }
.dlg input:focus { border-color: var(--g); }
.dlg .err { color: var(--dn); font-size: 12px; margin-top: 6px; min-height: 18px; }
.dlg ul { margin: 0 0 16px 18px; padding: 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.6; }
.dlg .acts { display: flex; gap: 8px; justify-content: flex-end; }

@media (max-width: 960px) {
  .tl { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .wrap { padding: 0 14px 90px; }
  .head .pill-tabs { width: 100%; overflow-x: auto; }
  .head .pill-tabs button { white-space: nowrap; padding: 10px 14px; font-size: 13px; }
  .nav { display: none; }
  .content { padding: 16px 14px 30px; }
  .hero { padding: 26px 20px; }
  .hero h3 { font-size: 26px; }
  .pod { display: none; }
  .stats b { font-size: 18px; }
  .pools { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main class="wrap">
  <div class="head">
    <div>
      <span class="eyebrow">Idea 01 &middot; Trading &middot; P1</span>
      <h1>Team contests</h1>
      <p>Register for a contest as a team, invite friends by link and watch the roster fill. A team has up to 6 members and competes on its own leaderboard with its own prize pool.</p>
    </div>
    <div class="pill-tabs" role="tablist" aria-label="Scenes">
      <button class="on" role="tab" data-scene="a">A &middot; Contest</button>
      <button role="tab" data-scene="b">B &middot; Team and invites</button>
      <button role="tab" data-scene="c">C &middot; Leaderboards</button>
    </div>
  </div>

  <div class="cap" id="cap"></div>

  <div class="pwa">
    <aside class="nav" id="nav" aria-label="PWA navigation"></aside>
    <div class="pmain">
      <div class="top" id="top"></div>
      <div class="content" id="view"></div>
    </div>
  </div>
</main>

<div class="ovl" id="ovl" hidden></div>

<script src="../../assets/js/common.js"></script>
<script>
(function () {
  var $ = XM.$, $$ = XM.$$, esc = XM.esc;
  var MAX = 6;
  var CAPS = {
    a: ['A', '<b>Contest.</b> The Competitions page now has a <b>Register as a team</b> button next to Join. Try it on the Demo Challenge.'],
    b: ['B', '<b>Team and invites.</b> Share the invite link, see how many members joined by it, up to 6 in total. Use the demo button to simulate friends joining.'],
    c: ['C', '<b>Leaderboards.</b> Individual and team rankings run in parallel, and the team track has its own prize pool.']
  };
  var CONTESTS = [
    { id: 'demo', name: 'Demo Challenge', status: 'progress', chips: ['FREE ENTRY'], time: 2 * 86400 + 13 * 3600 + 20 * 60 + 4, g: '' },
    { id: 'sprint', name: 'Weekend Sprint', status: 'upcoming', chips: ['FREE ENTRY'], timeText: 'STARTS IN 3D 4H', g: 'b' },
    { id: 'cup', name: 'Autumn Cup', status: 'ended', chips: ['ENDED'], timeText: 'ENDED 12 DAYS AGO', g: 'c' }
  ];
  var FRIENDS = ['Kenji_FX', 'Aiko', 'Ryu_trader', 'Mika88', 'Hiro', 'Sora_T', 'Daiki', 'Yuna'];
  var TAKEN = ['shogun squad', 'samurai desk', 'admin', 'xmtrading'];
  var ST = { demo: { mode: 'none', team: null }, sprint: { mode: 'none', team: null }, cup: { mode: 'none', team: null } };
  var cur = 'demo', view = 'contests', filter = 'progress', clock = 0;

  function contest(id) { return CONTESTS.filter(function (c) { return c.id === id; })[0]; }
  function initials(n) { return n.replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase() || '??'; }
  function code(name) { var h = 7; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 1679616; return ('000000' + (h + 46656).toString(36).toUpperCase()).slice(-6); }
  function link(t) { return 'xmtrading.com/t/' + t.code; }
  function joinedByInvite(t) { return t.members.length - 1; }
  function icon(n) { return XM.icon(n); }

  /* ------------------------------------------------ chrome */
  function drawChrome() {
    var items = [['home', 'Home'], ['chart', 'Markets'], ['wallet', 'Portfolio'], ['copy', 'Copy'], ['trophy', 'Competitions'], ['bolt', 'Boost'], ['grid', 'More']];
    $('#nav').innerHTML = '<span class="lg"><span class="xm-logo">' + XM.logo() + '</span></span>' + items.map(function (i) { return '<button type="button" aria-label="' + i[1] + '" class="' + (i[0] === 'trophy' ? 'on' : '') + '" data-nav="' + i[1] + '">' + icon(i[0]) + '</button>'; }).join('') + '<span class="sp"></span><button type="button" aria-label="Support" data-nav="Support">' + icon('headset') + '</button>';
    $('#top').innerHTML = '<span class="bellw">' + icon('bell') + '</span>' + icon('wallet') + icon('user');
  }
  $('#nav').addEventListener('click', function (e) { var b = e.target.closest('[data-nav]'); if (b && b.getAttribute('data-nav') !== 'Competitions') XM.toast(b.getAttribute('data-nav') + ' is not part of this prototype'); });

  /* ------------------------------------------------ views */
  function fmt(s) { var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return d + 'D ' + h + 'H ' + m + 'M ' + x + 'S'; }
  function cardHTML(c) {
    var s = ST[c.id], t = s.team, time = c.time ? 'ENDS IN ' + fmt(c.time - clock) : c.timeText;
    var body;
    if (c.status === 'ended') body = '<div class="note">This contest has finished. Team registration is closed.</div><button type="button" class="btn btn-outline btn-sm" data-a="results">View results</button>';
    else if (s.mode === 'team') body = '<div class="joined"><span>Team: ' + esc(t.name) + '</span><span class="mini"><span class="dots">' + dots(t) + '</span>' + t.members.length + '/' + MAX + '</span></div><button type="button" class="btn btn-primary btn-sm" data-a="manage" data-c="' + c.id + '">Manage team and invites</button>';
    else if (s.mode === 'solo') body = '<div class="joined"><span>You joined this contest</span></div><div class="row2"><button type="button" class="btn btn-outline btn-sm" data-a="team" data-c="' + c.id + '">Register as a team</button></div><div class="note">You can still start a team. Your solo entry carries over.</div>';
    else body = '<div class="row2"><button type="button" class="btn btn-primary btn-sm" data-a="join" data-c="' + c.id + '">Join</button><button type="button" class="btn btn-outline btn-sm" data-a="team" data-c="' + c.id + '" data-test="team-btn">Register as a team</button></div><div class="note">Compete alone, or with up to ' + (MAX - 1) + ' friends.</div>';
    return '<article class="cc"><div class="cc-img ' + c.g + '"><span class="ring"></span><div class="chp">' + c.chips.map(function (x) { return '<span>' + x + '</span>'; }).join('') + '<span data-cd="' + c.id + '">' + time + '</span></div><h4>' + c.name + '</h4></div><div class="cc-b">' + body + '</div></article>';
  }
  function dots(t) { var h = ''; for (var i = 0; i < MAX; i++) h += '<i class="' + (i < t.members.length ? 'f' : '') + '"></i>'; return h; }
  function contestsView() {
    var list = CONTESTS.filter(function (c) { return filter === 'part' ? ST[c.id].mode !== 'none' : c.status === filter; });
    return '<h2 class="t">Competitions</h2><div class="ptabs"><button class="on" type="button">Competitions</button><button type="button" data-nav2="Hall of Fame">Hall of Fame</button><button type="button" data-nav2="History">History</button></div>' +
      '<div class="hero"><small>PUT YOUR SKILLS TO THE TEST</small><h3>Trade. Compete. Win.</h3><p>Rise through the ranks, alone or with your team, and compete for real withdrawable prizes*<br>on your demo account.</p><div class="pod"><i></i><i></i><i></i><b></b></div></div>' +
      '<div class="pills">' + [['part', 'Participating'], ['progress', 'In Progress'], ['upcoming', 'Upcoming'], ['ended', 'Ended']].map(function (f) { return '<button type="button" class="' + (filter === f[0] ? 'on' : '') + '" data-f="' + f[0] + '">' + f[1] + '</button>'; }).join('') + '</div>' +
      (list.length ? '<div class="cards">' + list.map(cardHTML).join('') + '</div>' : '<div class="empty"><h3>Nothing here yet</h3><p>You have not joined any contest. Pick one from In Progress or Upcoming.</p></div>') +
      '<p class="msg" style="margin-top:16px">*Illustrative. Prize rules, eligibility and terms would apply. Contest results are not a guide to future trading results.</p>';
  }

  function slotRows(t) {
    var h = '';
    t.members.forEach(function (m, i) {
      h += '<div class="mem"><span class="av c' + (i % 6) + '">' + initials(m.n) + '</span><div class="nm"><b>' + esc(m.n) + (m.self ? ' (you)' : '') + '</b><small>' + (m.role === 'Captain' ? 'Captain (Daimyo) \u00b7 created the team' : 'Member \u00b7 joined by your invite \u00b7 ' + m.at) + '</small></div>' + (m.self ? '<span class="tag">Captain</span>' : '<button type="button" class="rm" data-a="remove" data-i="' + i + '">Remove</button>') + '</div>';
    });
    for (var k = t.members.length; k < MAX; k++) h += '<div class="mem empty"><span class="av">+</span><div class="nm"><b>Open spot</b><small>Waiting for someone to join</small></div><button type="button" data-a="copy">Copy link</button></div>';
    return h;
  }
  function teamView() {
    var c = contest(cur), s = ST[cur], t = s.team;
    if (s.mode !== 'team') {
      return '<div class="crumb"><button type="button" data-a="back">Competitions</button> / ' + c.name + '</div><div class="box empty"><div class="ic">' + icon('users') + '</div><h3>You have no team yet</h3><p>Register as a team for the ' + c.name + ' to get an invite link. You can bring up to ' + (MAX - 1) + ' friends, ' + MAX + ' players in total.</p><button type="button" class="btn btn-primary" data-a="team" data-c="' + cur + '">Register as a team</button></div>';
    }
    var full = t.members.length >= MAX, left = MAX - t.members.length;
    var slots = ''; for (var i = 0; i < MAX; i++) slots += '<i class="' + (i < t.members.length ? 'f' : '') + '"></i>';
    return '<div class="crumb"><button type="button" data-a="back">Competitions</button> / ' + c.name + ' / Team</div>' +
      '<div class="tname"><span class="lg">' + initials(t.name) + '</span><div><h2>' + esc(t.name) + '</h2><small>Team in the ' + c.name + '</small></div></div>' +
      '<div class="tl"><div class="box"><h3>Team roster</h3><div class="sub">Everyone who joins by your link appears here.</div>' +
      '<div class="stats"><div><small>Joined by your invite</small><b id="sInv">' + joinedByInvite(t) + ' <span>of ' + (MAX - 1) + '</span></b></div><div><small>Team size</small><b>' + t.members.length + ' <span>of ' + MAX + '</span></b></div><div><small>Open spots</small><b>' + left + '</b></div></div>' +
      '<div class="slots" aria-hidden="true">' + slots + '</div><div class="cnt"><b>' + t.members.length + ' of ' + MAX + ' joined</b> \u00b7 ' + (full ? 'team is full' : left + ' spot' + (left > 1 ? 's' : '') + ' left') + '</div>' +
      slotRows(t) + '</div>' +
      '<div class="box"><h3>Invite friends</h3><div class="sub">Anyone with the link can join until the team is full.</div>' +
      (full ? '<div class="full">Team is full (' + MAX + ' of ' + MAX + '). The invite link is paused. Remove a member to open a spot.</div>' : '') +
      '<div class="link' + (full ? ' off' : '') + '"><input id="lnk" readonly value="' + link(t) + '" aria-label="Invite link"><button type="button" class="btn btn-primary btn-sm" data-a="copy"' + (full ? ' disabled' : '') + '>Copy</button></div>' +
      '<div class="share"><button type="button" data-a="share" data-n="LINE"' + (full ? ' disabled' : '') + '>LINE</button><button type="button" data-a="share" data-n="WhatsApp"' + (full ? ' disabled' : '') + '>WhatsApp</button><button type="button" data-a="share" data-n="Telegram"' + (full ? ' disabled' : '') + '>Telegram</button></div>' +
      '<div class="msg">&ldquo;Join my team <b>' + esc(t.name) + '</b> in the XMTrading ' + c.name + '. Register with my link: ' + link(t) + '&rdquo;</div>' +
      '<div class="demo"><small>Prototype controls</small><button type="button" class="btn btn-outline btn-sm" data-a="sim"' + (full ? ' disabled' : '') + '>Simulate a friend joining</button><button type="button" class="lnk" data-a="disband">Disband team</button></div></div></div>';
  }

  function boardView() {
    var c = contest(cur), s = ST[cur], t = s.team, mode = s.mode;
    var ind = [['Kaito_Alpha', 1842], ['Mei_Trades', 1790], ['Taro_FX', 1655], ['Nana', 1601], ['Shin_88', 1544], ['Rei', 1498]];
    var teams = [['Shogun Squad', 6, 9120], ['Samurai Desk', 5, 8460], ['Night Owls', 4, 7015], ['Tokyo Bulls', 6, 6890]];
    var myRank = 7, myPts = 420 + (t ? t.members.length * 260 : 0);
    var tr = '', ir = '';
    ind.forEach(function (r, i) { ir += '<tr><td>' + (i + 1) + '</td><td>' + r[0] + '</td><td class="r">' + r[1] + '</td></tr>'; });
    ir += '<tr><td colspan="3" style="text-align:center;color:var(--mut)">\u2026</td></tr>' + (mode !== 'none' ? '<tr class="me"><td>38</td><td>You</td><td class="r">' + (320 + (t ? 40 : 0)) + '</td></tr>' : '');
    var rows = teams.slice(); var mine = t ? [t.name, t.members.length, myPts, true] : null;
    if (mine) rows.push(mine);
    rows.sort(function (a, b) { return b[2] - a[2]; });
    rows.forEach(function (r, i) { tr += '<tr class="' + (r[3] ? 'me' : '') + '"><td>' + (i + 1) + '</td><td>' + esc(r[0]) + (r[3] ? ' (your team)' : '') + '<span class="sm">' + r[1] + ' of ' + MAX + ' members</span></td><td class="r">' + r[2] + '</td></tr>'; });
    return '<div class="crumb"><button type="button" data-a="back">Competitions</button> / ' + c.name + ' / Leaderboards</div><h2 class="t">Leaderboards</h2>' +
      '<div class="pools"><div class="pool"><small>Individual prize pool</small><b>$2,000</b></div><div class="pool t"><small>Team prize pool (separate)</small><b>$1,000</b></div></div>' +
      '<div class="tl" style="grid-template-columns:1fr 1fr"><div class="box"><h3>Individual</h3><div class="sub">Ranked by contest points. Updates every few minutes.</div><table class="lb"><thead><tr><th>#</th><th>Trader</th><th class="r">Points</th></tr></thead><tbody>' + ir + '</tbody></table>' + (mode === 'none' ? '<div class="msg" style="margin-top:12px">You have not joined yet. Join or register a team in scene A.</div>' : '') + '</div>' +
      '<div class="box"><h3>Teams</h3><div class="sub">Team points are the sum of its members\u2019 points. Members also keep their individual rank.</div><table class="lb"><thead><tr><th>#</th><th>Team</th><th class="r">Points</th></tr></thead><tbody>' + tr + '</tbody></table>' + (t ? '<div class="msg" style="margin-top:12px">Every member you add may lift the team total, but a team keeps ' + MAX + ' players at most.</div>' : '<div class="msg" style="margin-top:12px">Register a team to appear here and to share in the team prize pool.</div>') + '</div></div>' +
      '<p class="msg" style="margin-top:16px">Illustrative names, points and prizes. Real rules, eligibility and anti-abuse checks would apply.</p>';
  }

  function draw() {
    $('#view').innerHTML = view === 'contests' ? contestsView() : view === 'team' ? teamView() : boardView();
  }

  /* ------------------------------------------------ team actions */
  function openDialog(cid) {
    var c = contest(cid), o = $('#ovl');
    o.hidden = false;
    o.innerHTML = '<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dT"><h3 id="dT">Register as a team</h3><p>Create a team for the <b>' + c.name + '</b>. You become the captain and get a link to invite friends.</p><ul><li>Up to ' + MAX + ' players per team, including you</li><li>Teams compete on a team leaderboard and a separate prize pool</li><li>Everyone still competes individually too</li></ul><label for="tn">Team name</label><input id="tn" maxlength="24" placeholder="e.g. Ninja Crew" autocomplete="off"><div class="err" id="te"></div><div class="acts"><button type="button" class="btn btn-outline" data-d="cancel">Cancel</button><button type="button" class="btn btn-primary" data-d="ok" data-c="' + cid + '">Create team</button></div></div>';
    setTimeout(function () { var i = $('#tn'); if (i) i.focus(); }, 30);
  }
  function closeDialog() { $('#ovl').hidden = true; $('#ovl').innerHTML = ''; }
  function createTeam(cid) {
    var n = $('#tn').value.trim(), e = '';
    if (n.length < 3) e = 'Team name needs at least 3 characters.';
    else if (!/^[\w \-\u3040-\u30ff\u4e00-\u9fff]+$/.test(n)) e = 'Use letters, numbers, spaces or hyphens only.';
    else if (TAKEN.indexOf(n.toLowerCase()) > -1) e = 'That name is already taken. Try another one.';
    if (e) { $('#te').textContent = e; return; }
    ST[cid] = { mode: 'team', team: { name: n, code: code(n), members: [{ n: 'You', role: 'Captain', self: true }], next: 0 } };
    closeDialog(); filter = 'part'; cur = cid;
    XM.toast('Team \u201c' + n + '\u201d created. Invite your friends.');
    setScene('b');
  }
  function addFriend() {
    var t = ST[cur].team; if (!t || t.members.length >= MAX) return;
    var name = FRIENDS[t.next % FRIENDS.length]; t.next++;
    t.members.push({ n: name, role: 'Member', at: 'just now' });
    XM.toast(name + ' joined your team (' + t.members.length + ' of ' + MAX + ')');
    if (t.members.length >= MAX) XM.toast('Your team is full');
    draw();
  }

  $('#view').addEventListener('click', function (e) {
    var f = e.target.closest('[data-f]'); if (f) { filter = f.getAttribute('data-f'); draw(); return; }
    var n2 = e.target.closest('[data-nav2]'); if (n2) { XM.toast(n2.getAttribute('data-nav2') + ' is not part of this prototype'); return; }
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a'), cid = b.getAttribute('data-c');
    if (a === 'team') openDialog(cid);
    else if (a === 'join') { ST[cid].mode = 'solo'; XM.toast('You joined ' + contest(cid).name); draw(); }
    else if (a === 'manage') { cur = cid; setScene('b'); }
    else if (a === 'back') setScene('a');
    else if (a === 'results') XM.toast('Results open here (demo)');
    else if (a === 'copy') { var t = ST[cur].team; if (!t || t.members.length >= MAX) return; var l = 'https://' + link(t); try { navigator.clipboard.writeText(l).then(function () { XM.toast('Invite link copied'); }, function () { XM.toast('Invite link ready to copy'); }); } catch (x) { XM.toast('Invite link ready to copy'); } }
    else if (a === 'share') XM.toast('Opening ' + b.getAttribute('data-n') + ' with your invite (demo)');
    else if (a === 'sim') addFriend();
    else if (a === 'remove') { var tm = ST[cur].team, i = +b.getAttribute('data-i'), nm = tm.members[i].n; tm.members.splice(i, 1); XM.toast(nm + ' removed. Their spot is open again.'); draw(); }
    else if (a === 'disband') { ST[cur] = { mode: 'none', team: null }; XM.toast('Team disbanded'); draw(); }
  });
  $('#ovl').addEventListener('click', function (e) {
    var d = e.target.closest('[data-d]');
    if (d && d.getAttribute('data-d') === 'ok') createTeam(d.getAttribute('data-c'));
    else if ((d && d.getAttribute('data-d') === 'cancel') || e.target.id === 'ovl') closeDialog();
  });
  $('#ovl').addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'tn') { var ok = $('[data-d=ok]'); if (ok) createTeam(ok.getAttribute('data-c')); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#ovl').hidden) closeDialog(); });

  /* ------------------------------------------------ scenes + clock */
  function setScene(s) {
    if (!CAPS[s]) s = 'a';
    view = { a: 'contests', b: 'team', c: 'board' }[s];
    $$('[data-scene]').forEach(function (b) { var on = b.getAttribute('data-scene') === s; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    $('#cap').innerHTML = '<span class="n">' + CAPS[s][0] + '</span><span>' + CAPS[s][1] + '</span>';
    draw();
    try { history.replaceState(null, '', '#' + s); } catch (e) {}
  }
  $$('[data-scene]').forEach(function (b) { b.addEventListener('click', function () { setScene(b.getAttribute('data-scene')); }); });
  setInterval(function () { clock++; var c = contest('demo'), el = $('[data-cd=demo]'); if (el) el.textContent = 'ENDS IN ' + fmt(c.time - clock); }, 1000);

  drawChrome();
  setScene(XM.qs('scene') || location.hash.replace('#', '') || 'a');

  XM.notes({
    title: 'Team contests (idea 01)',
    today: 'Contests are individual. A client who falls behind on the leaderboard has little reason to keep trading, and there is no built-in reason to invite friends.',
    proposed: 'A Register as a team button on each contest. The captain gets an invite link, sees how many members joined by it, and can have up to 6 players in total. Teams compete on a team leaderboard with a separate prize pool, in parallel with the individual one.',
    why: 'Teams may keep clients trading for their team\u2019s rank even when their own rank is low, and invites may bring friends into the platform. Not validated yet.',
    metric: 'Teams created, members per team, invite-to-join conversion, registrations and funded accounts from invites, trading volume and active days of team members versus solo players. Watch for multi-accounting and complaints.'
  });
})();
</script>
<script src="../../assets/js/review.js" data-idea="01"></script>
</body>
</html>
