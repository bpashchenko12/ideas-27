        '<label>' + esc(L.ctry) + '<select tabindex="-1"><option>Cyprus</option></select></label><label>' + esc(L.pw) + '<input type="password" value="password" tabindex="-1"></label>' +
        '<button type="button" data-reg>' + esc(L.cta) + '</button><p>Illustrative form. The real registration is the standard XMTrading flow with the referral code ' + REF + ' attached.</p></form></div>' +
      '<div class="sec"><h4>' + esc(L.get) + '</h4><div class="tiles">' + T.tiles.map(function (t) { return '<div><b>' + esc(t[0]) + '</b>' + esc(t[1]) + '</div>'; }).join('') + '</div></div>' +
      '<div class="risk">Trading leveraged products such as CFDs carries a high level of risk and may result in the loss of your invested capital. Locked text added by XMTrading, not editable by the affiliate. Illustrative prototype.</div></div>';
  }
  function mount(host, m, mobile, w) {
    var sv = $('.sv', host), sz = $('.sz', sv), sc = $('.scale', sz);
    sc.style.width = w + 'px'; sc.innerHTML = pageHTML(m, mobile);
    var k = (sv.clientWidth || w) / w; sc.style.transform = 'scale(' + k + ')';
    sz.style.height = Math.ceil(sc.offsetHeight * k) + 'px'; sz.style.width = (sv.clientWidth || w) + 'px';
  }

  /* ---------- shell ---------- */
  function stampHTML() { var t = { approved: 'Approved', pending: 'In review', draft: S.pubDirty ? 'Draft' : 'Draft' }[S.status]; return '<span class="stamp ' + S.status + '">' + t + '</span>'; }
  function portal(title, tools, body) {
    return '<div class="app"><nav class="nav"><span class="xm-logo">' + XM.logo(false) + '</span><small>Partner portal</small>' +
      [['home', 'Overview'], ['share', 'Links'], ['trophy', 'Campaigns'], ['globe', 'Sign-up page', 1], ['chart', 'Reports'], ['wallet', 'Payments']].map(function (n) { return '<a href="#" tabindex="-1"' + (n[2] ? ' class="on"' : '') + '>' + XM.icon(n[0]) + n[1] + '</a>'; }).join('') + '</nav>' +
      '<div class="main"><div class="ph"><h2>' + title + '</h2><div class="tools">' + tools + '</div></div>' + body + '</div></div>';
  }

  /* ---------- scene A ---------- */
  function renderA() {
    var m = S.draft, I = issues(m), dirty = JSON.stringify(S.draft) !== JSON.stringify(S.pub);
    var tools = '<span class="st">Status ' + stampHTML() + '</span>';
    var body = '<div class="ed"><div class="card" style="padding:8px 22px 18px">' +
      (S.note ? '<div class="rv" style="margin-top:14px"><b>Note from XMTrading:</b> ' + esc(S.note) + '</div>' : '') +
      '<div class="row"><span class="lb">Profile photo</span><div><div class="avs">' + AVS.map(function (a, i) { return '<button class="avb' + (m.photo === i ? ' on' : '') + '" data-photo="' + i + '" aria-label="Sample photo ' + (i + 1) + '">' + avHTML(i, m.name, 52) + '</button>'; }).join('') + '</div><div class="hint">Approved photo or logo only. Reviewed by XMTrading before it goes live.</div></div></div>' +
      '<div class="row"><label for="fName">Profile name</label><div><input class="inp" id="fName" maxlength="30" value="' + esc(m.name) + '"><div class="cnt"><span id="eName"></span><span id="cName"></span></div></div></div>' +
      '<div class="row"><span class="lb">Language</span><div><div class="chips" role="group" aria-label="Language">' + Object.keys(LANG).map(function (k) { return '<button class="chip' + (m.lang === k ? ' on' : '') + '" data-lang="' + k + '">' + esc(LANG[k].n) + '</button>'; }).join('') + '</div><div class="hint">Each language is its own version of the page, with its own review.</div></div></div>' +
      '<div class="row"><span class="lb">Template</span><div class="tpls">' + Object.keys(TPL).map(function (k) { var t = TPL[k]; return '<button class="tpl' + (m.tpl === k ? ' on' : '') + '" data-tpl="' + k + '" style="--tc:' + t.c + '"><span class="ck">' + CHECK + '</span><div class="th"><i></i><i></i><i></i></div><b>' + esc(t.n) + '</b><small>' + esc(t.d) + '</small></button>'; }).join('') + '</div></div>' +
      '<div class="row"><label for="fAbout">About me</label><div><textarea class="ta" id="fAbout" maxlength="140" rows="3">' + esc(m.about) + '</textarea><div class="cnt"><span id="eAbout"></span><span id="cAbout"></span></div></div></div>' +
      '<div class="row"><span class="lb">Event highlight</span><div><div class="chips" role="group" aria-label="Event highlight">' + EVENTS.map(function (e, i) { return '<button class="chip' + (m.ev === i ? ' on' : '') + '" data-ev="' + i + '">' + esc(e) + '</button>'; }).join('') + '</div><div class="hint">Choose from events XMTrading has approved for partners.</div></div></div>' +
      '<div class="row"><label for="fBen">Benefit description</label><div><input class="inp" id="fBen" maxlength="70" value="' + esc(m.benefit) + '"><div class="cnt"><span id="eBen"></span><span id="cBen"></span></div></div></div>' +
      '<div class="acts"><span class="mut" id="dnote" style="font-size:12.5px"></span><span class="sp1"></span><button class="btn btn-outline" id="reset">Reset</button><button class="btn btn-primary" id="submit">Submit for review</button></div>' +
      '<div class="guard"><b>What XMTrading controls:</b> approved templates, compliant claims, the registration form and the risk warning. Affiliates control the personal parts above.</div>' +
      '</div>' +
      '<div class="pvc"><div class="pvh"><h3>Page Preview</h3><div class="pill-tabs" role="tablist" aria-label="Preview device"><button class="' + (S.dev === 'desktop' ? 'on' : '') + '" data-dev="desktop">Desktop</button><button class="' + (S.dev === 'mobile' ? 'on' : '') + '" data-dev="mobile">Mobile</button></div></div><div class="pvb" id="pvb"></div><div class="pvn">Updates as you type. Illustrative content.</div></div></div>';
    $('#stage').innerHTML = portal('My Sign-Up Page', tools, body);
    renderPreview(); feedback();
  }
  function renderPreview() {
    var host = $('#pvb'); if (!host) return;
    var m = S.draft;
    if (S.dev === 'desktop') {
      host.innerHTML = '<div class="browser"><div class="bar"><i></i><i></i><i></i><span class="url">' + esc(urlOf(m)) + '</span></div><div class="sv"><div class="sz"><div class="scale"></div></div></div></div>';
      mount(host, m, false, 900);
    } else {
      host.innerHTML = '<div class="pvm"><div class="phone"><span class="notch"></span><div class="scr"><div class="sv" style="padding-top:26px;background:#fff"><div class="sz"><div class="scale"></div></div></div></div></div></div>';
      mount(host, m, true, 390);
    }
  }
  function feedback() {
    var m = S.draft, I = issues(m);
    function f(id, cid, eid, val, max, key) {
      var e = $('#' + id); if (!e) return;
      var bad = I.filter(function (x) { return x.f === key; });
      e.classList.toggle('err', !!bad.length);
      $('#' + cid).textContent = val.length + ' / ' + max;
      $('#' + eid).innerHTML = bad.length ? '<span class="bad">&ldquo;' + esc(bad[0].word) + '&rdquo; is not allowed. Remove or rephrase it.</span>' : '';
    }
    f('fName', 'cName', 'eName', m.name, 30, 'name'); f('fAbout', 'cAbout', 'eAbout', m.about, 140, 'about'); f('fBen', 'cBen', 'eBen', m.benefit, 70, 'benefit');
    var dirty = JSON.stringify(S.draft) !== JSON.stringify(S.pub), sb = $('#submit'), dn = $('#dnote');
    if (!dirty && S.status === 'draft') S.status = 'approved';
    if (sb) { sb.disabled = !!I.length || !m.name.trim() || S.status === 'pending' || (S.status === 'approved' && !dirty); sb.textContent = S.status === 'pending' ? 'In review' : 'Submit for review'; }
    if (dn) dn.textContent = I.length ? I.length + ' claim' + (I.length > 1 ? 's' : '') + ' to fix before you can submit' : S.status === 'approved' && !dirty ? 'Published version. Edit anything to start a new draft.' : S.status === 'pending' ? 'Waiting for XMTrading. The published page has not changed.' : 'Changes are not live until XMTrading approves them.';
    var st = $('.st'); if (st) st.innerHTML = 'Status ' + stampHTML();
  }
  function touched() { if (S.status !== 'draft') { S.status = 'draft'; } S.note = ''; }
  function head() {
    var c = CAPS[S.scene]; $('#cap').innerHTML = '<span class="n">' + c[0] + '</span><span>' + c[1] + '</span>';
    $$('[data-scene]').forEach(function (b) { var on = b.getAttribute('data-scene') === S.scene; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  }

  /* ---------- scene B ---------- */
  function renderB() {
    var tools = '<span class="st">Status ' + stampHTML() + '</span>', body;
    var m = S.draft, I = issues(m);
    if (S.status === 'draft') {
      body = '<div class="emp"><h3>Nothing waiting for review</h3>Submit a draft from the editor and it appears here for XMTrading.<br><button class="btn btn-primary" data-scene="a">Go to the editor</button></div>';
    } else {
      var steps = ['Draft', 'Submitted', 'Approved'], cur = S.status === 'approved' ? 2 : 1;
      var tl = '<div class="tlv">' + steps.map(function (s, i) { return (i ? '<span class="ln' + (i <= cur ? ' on' : '') + '"></span>' : '') + '<span class="s' + (i <= cur ? ' on' : '') + (i === cur ? ' cur' : '') + '"><i>' + (i < cur || S.status === 'approved' ? CHECK.replace('<svg', '<svg width="12" height="12"') : i + 1) + '</i>' + s + '</span>'; }).join('') + '</div>';
      var items = [
        ['General', 'Approved template used', TPL[m.tpl].n + ' (' + LANG[m.lang].n + ')', 1],
        ['Photo', 'Photo or logo meets the guidelines', 'Simulated check', 1],
        ['Claims', 'No guaranteed or risk-free wording', I.length ? 'Found: ' + I.map(function (x) { return '\u201c' + x.word + '\u201d'; }).join(', ') : 'About me and benefit text are clean', !I.length],
        ['Event', 'Event highlight is from the approved list', EVENTS[m.ev], 1],
        ['Risk', 'Standard risk warning shown', 'Locked by XMTrading, cannot be edited', 1]
      ];
      var done = S.status === 'approved';
      body = '<div class="rd"><div>' + tl + '<h3 style="font-size:15px;margin-bottom:10px">Review checklist</h3><div class="chk">' +
        items.map(function (x) { return '<div class="' + (x[3] ? '' : 'x') + '"><i>' + (x[3] ? CHECK : CROSS) + '</i><span><b>' + x[1] + '</b><small>' + esc(x[2]) + '</small></span></div>'; }).join('') + '</div></div>' +
        '<div class="dec"><h3>' + (done ? 'Approved and live' : 'Decision') + '</h3><p>' + (done ? 'The page below is what visitors now see.' : 'Reviewing <b>' + esc(m.name) + '</b>\u2019s page, ' + esc(LANG[m.lang].n) + ' version.') + '</p>' +
        (done ? '<button class="btn btn-primary" data-scene="c">View the live page</button><button class="btn btn-outline" data-scene="a">Back to the editor</button>' :
          '<button class="btn btn-primary" id="approve"' + (I.length ? ' disabled' : '') + '>Approve and publish</button><button class="btn btn-outline" id="changes">Request changes</button>') +
        (done ? '<div class="ok">Published as <b>' + esc(urlOf(S.pub)) + '</b></div>' : '') + '</div></div>';
    }
    $('#stage').innerHTML = portal('Review: My Sign-Up Page', tools, body);
  }

  /* ---------- scene C ---------- */
  function renderC() {
    var m = S.pub, mobile = window.innerWidth < 760;
    var behind = JSON.stringify(S.draft) !== JSON.stringify(S.pub);
    $('#stage').innerHTML = '<div class="vis"><div class="pubnote"><span class="tag">Live</span><span>This is the <b>published</b> version.' + (behind ? ' Your draft changes are not live yet' + (S.status === 'pending' ? ', they are in review.' : '.') : '') + '</span></div>' +
      '<div class="vis-w card" style="border-radius:20px"><div class="browser"><div class="bar"><i></i><i></i><i></i><span class="url">' + esc(urlOf(m)) + '</span></div>' + pageHTML(m, mobile) + '</div></div></div>';
  }

  function render() { head(); S.scene === 'a' ? renderA() : S.scene === 'b' ? renderB() : renderC(); }
  function go(s) { S.scene = s; render(); }

  /* ---------- events ---------- */
  document.addEventListener('input', function (e) {
    var id = e.target.id, m = S.draft; if (!id) return;
    if (id === 'fName') m.name = e.target.value; else if (id === 'fAbout') m.about = e.target.value; else if (id === 'fBen') m.benefit = e.target.value; else return;
    touched(); renderPreview(); feedback();
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, a'); if (!t) return;
    if (t.tagName === 'A' && t.getAttribute('href') === '#') e.preventDefault();
    var m = S.draft, d = function (k) { return t.getAttribute('data-' + k); };
    if (t.hasAttribute('data-scene')) { go(d('scene')); return; }
    if (t.hasAttribute('data-reg')) { XM.toast('Prototype: nothing is submitted'); return; }
    if (t.hasAttribute('data-dev')) { S.dev = d('dev'); $$('[data-dev]').forEach(function (b) { b.classList.toggle('on', b === t); }); renderPreview(); return; }
    if (t.hasAttribute('data-photo')) { m.photo = +d('photo'); touched(); renderA(); return; }
    if (t.hasAttribute('data-lang')) { m.lang = d('lang'); touched(); renderA(); return; }
    if (t.hasAttribute('data-tpl')) { m.tpl = d('tpl'); touched(); renderA(); return; }
    if (t.hasAttribute('data-ev')) { m.ev = +d('ev'); touched(); renderA(); return; }
    if (t.id === 'reset') { S.draft = clone(S.pub); S.status = 'approved'; S.note = ''; renderA(); return; }
    if (t.id === 'submit') { S.status = 'pending'; S.note = ''; XM.toast('Submitted to XMTrading for review'); go('b'); return; }
    if (t.id === 'approve') { S.pub = clone(S.draft); S.status = 'approved'; XM.toast('Approved. The page is live'); renderB(); return; }
    if (t.id === 'changes') { S.status = 'draft'; S.note = 'Please make the introduction more specific to your audience and resubmit.'; XM.toast('Changes requested'); go('a'); return; }
  });
  window.addEventListener('resize', function () { if (S.scene === 'a') renderPreview(); else if (S.scene === 'c') renderC(); });

  render();

  XM.notes({
    title: 'Personalized sign-up page (idea 13)',
    today: 'Affiliates send traffic to generic XMTrading pages. Visitors do not see who invited them, so there is little personal trust at the moment of sign-up.',
    proposed: 'Affiliates configure an approved photo, name, language, introduction, benefit and event highlight on an approved template, with a live desktop and mobile preview. XMTrading reviews it before publishing; the form and risk warning stay locked.',
    why: 'A familiar face and a message in the visitor\u2019s language may lift visit-to-registration conversion while keeping claims compliant.',
    metric: 'Visit-to-registration and registration-to-first-deposit conversion, funded clients per page, cost per funded client vs generic pages, content approval rate and compliance incidents.'
  });
})();
</script>
<script src="../../assets/js/review.js" data-idea="13"></script>
</body>
</html>
